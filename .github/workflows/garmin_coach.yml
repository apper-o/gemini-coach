name: Garmin Coach Automated Run

on:
  schedule:
    # Codziennie o 6:42 UTC (8:42 CEST w okresie letnim / 7:42 CET w okresie zimowym)
    - cron: '42 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Wybierz tryb działania Garmin Coach'
        required: true
        default: 'yesterday'
        type: choice
        options:
          - yesterday
          - week
          - suggest
          - daily
      user_note:
        description: 'Opcjonalna notatka/wiadomość dla trenera (np. siłownia, samopoczucie)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  run-coach:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Konfiguracja Pythona 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache sesji i tokenów OAuth Garmina
        uses: actions/cache@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-${{ secrets.GARMIN_EMAIL }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            garmin-tokens-${{ secrets.GARMIN_EMAIL }}-
            garmin-tokens-

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aktualizacja notatki użytkownika (jeśli podano przy wywołaniu ręcznym)
        if: "${{ github.event.inputs.user_note != '' }}"
        run: |
          mkdir -p prompts
          echo "${{ github.event.inputs.user_note }}" > prompts/user_note.md

      - name: Uruchomienie Garmin Coach
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          USE_LOCAL_DATA: "false"
          DEBUG: "false"
        run: |
          MODE="${{ github.event.inputs.mode || 'yesterday' }}"
          echo "Uruchamianie w trybie: $MODE"
          python garmin_coach.py "$MODE"

      - name: Wysyłka raportu na Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "output/last_daily_report.md" ]; then
            python send_telegram.py output/last_daily_report.md
          elif [ -f "output/weekly_plan.md" ]; then
            python send_telegram.py output/weekly_plan.md
          else
            echo "Brak pliku raportu do wysłania na Telegram."
          fi

      - name: Wyświetlenie raportu w podsumowaniu GitHub Actions (Step Summary)
        if: always()
        run: |
          if [ -f "output/last_daily_report.md" ]; then
            cat output/last_daily_report.md >> $GITHUB_STEP_SUMMARY
          elif [ -f "output/weekly_plan.md" ]; then
            cat output/weekly_plan.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Zapis i commit wygenerowanych danych do repozytorium
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trainings_history/ output/ input/weekly_preferences.md prompts/user_note.md || true
          if git diff --staged --quiet; then
            echo "Brak nowych zmian do zapisania w repozytorium."
          else
            MODE="${{ github.event.inputs.mode || 'yesterday' }}"
            git commit -m "Automatyczny raport Garmin Coach [$MODE] [skip ci]"
            git push
          fi
