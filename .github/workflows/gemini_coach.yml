name: Gemini Coach Automated Run

on:
  # Wyzwalanie punktualne z zewnętrznego serwisu (cron-job.org) oraz ręczne przez GitHub UI / API
  workflow_dispatch:
    inputs:
      mode:
        description: 'Wybierz tryb działania Gemini Coach'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - plan

permissions:
  contents: write

jobs:
  run-coach:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Konfiguracja Pythona 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache sesji i tokenów OAuth Garmina
        uses: actions/cache@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-${{ secrets.GARMIN_EMAIL }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            garmin-tokens-${{ secrets.GARMIN_EMAIL }}-
            garmin-tokens-

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Uruchomienie Gemini Coach
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS_BASE64: ${{ secrets.GARMIN_TOKENS_BASE64 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || secrets.GEMINI_MODEL || 'gemini-3.8-flash' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_MODE: ${{ github.event.inputs.mode || 'daily' }}
        run: |
          echo "Uruchamianie w trybie: $TARGET_MODE"
          python coach_gemini.py "$TARGET_MODE"

      - name: Wysyłka raportu na Telegram
        if: success()
        run: |
          echo "Wysyłka raportu na Telegram została zrealizowana bezpośrednio przez coach_gemini.py."

      - name: Wyświetlenie raportu w podsumowaniu GitHub Actions (Step Summary)
        if: success()
        run: |
          if [ "${{ github.event.inputs.mode }}" = "plan" ] && [ -f "output/weekly_plan.md" ]; then
            cat output/weekly_plan.md >> $GITHUB_STEP_SUMMARY
          elif [ -f "output/last_daily_report.md" ]; then
            cat output/last_daily_report.md >> $GITHUB_STEP_SUMMARY
          elif [ -f "output/weekly_plan.md" ]; then
            cat output/weekly_plan.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Zapis i commit wygenerowanych danych do repozytorium
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trainings_history/ output/ input/ || true
          if git diff --staged --quiet; then
            echo "Brak nowych zmian do zapisania w repozytorium."
          else
            MODE="${{ github.event.inputs.mode || 'daily' }}"
            git commit -m "Automatyczny raport Gemini Coach [$MODE] [skip ci]"
            git push
          fi
