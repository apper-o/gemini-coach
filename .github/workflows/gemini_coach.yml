name: Gemini Coach Automated Run

on:
  schedule:
    # Codziennie o 6:42 UTC (8:42 CEST w okresie letnim / 7:42 CET w okresie zimowym)
    - cron: '42 6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Wybierz tryb działania Gemini Coach'
        required: true
        default: 'yesterday'
        type: choice
        options:
          - yesterday
          - week
          - suggest
          - daily
      user_note:
        description: 'Opcjonalna notatka/wiadomość dla trenera (np. siłownia, samopoczucie)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  run-coach:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Konfiguracja Pythona 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Cache sesji i tokenów OAuth Garmina
        uses: actions/cache@v4
        with:
          path: ~/.garminconnect
          key: garmin-tokens-${{ secrets.GARMIN_EMAIL }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            garmin-tokens-${{ secrets.GARMIN_EMAIL }}-
            garmin-tokens-

      - name: Instalacja zależności
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Przygotowanie notatki użytkownika dla GitHub Actions
        env:
          INPUT_USER_NOTE: ${{ github.event.inputs.user_note }}
        run: |
          mkdir -p prompts
          if [ -n "$INPUT_USER_NOTE" ]; then
            echo "Ustawianie nowej notatki wpisanej w GitHub Actions..."
            echo "$INPUT_USER_NOTE" > prompts/user_note.md
          else
            echo "Brak notatki dla tego uruchomienia – czyszczenie prompts/user_note.md, aby nie używać starej notatki z repozytorium."
            > prompts/user_note.md
          fi

      - name: Uruchomienie Gemini Coach
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODELS: "gemini-3.5-flash,gemini-3.5-flash-lite,gemini-3.0-flash-lite"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_MODE: ${{ github.event.inputs.mode || 'yesterday' }}
          USE_LOCAL_DATA: "false"
        run: |
          echo "Uruchamianie w trybie: $TARGET_MODE"
          python garmin_coach.py "$TARGET_MODE"

      - name: Wysyłka raportu na Telegram
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f "output/last_daily_report.md" ]; then
            python send_telegram.py output/last_daily_report.md
          elif [ -f "output/weekly_plan.md" ]; then
            python send_telegram.py output/weekly_plan.md
          else
            echo "Brak pliku raportu do wysłania na Telegram."
          fi

      - name: Wyświetlenie raportu w podsumowaniu GitHub Actions (Step Summary)
        if: success()
        run: |
          if [ -f "output/last_daily_report.md" ]; then
            cat output/last_daily_report.md >> $GITHUB_STEP_SUMMARY
          elif [ -f "output/weekly_plan.md" ]; then
            cat output/weekly_plan.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Zapis i commit wygenerowanych danych do repozytorium
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trainings_history/ output/ input/ || true
          if git diff --staged --quiet; then
            echo "Brak nowych zmian do zapisania w repozytorium."
          else
            MODE="${{ github.event.inputs.mode || 'yesterday' }}"
            git commit -m "Automatyczny raport Gemini Coach [$MODE] [skip ci]"
            git push
          fi
